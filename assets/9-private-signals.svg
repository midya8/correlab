<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1140" viewBox="0 0 1120 1140">
<rect width="1120" height="1140" fill="#edf2f5"/><rect x="16" y="16" width="1088" height="1108" rx="18" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#24313b}.muted{fill:#5c6c78}</style>
<text x="42" y="58" font-size="27" font-weight="700">Correlab / what can the player actually observe?</text>
<text x="42" y="90" font-size="17" class="muted">Trusted baseline executor. Private signal only. Pass or unilateral override. Exact rational witnesses.</text>
<text x="42" y="137" font-size="22" font-weight="700">The information model is part of the certificate</text>
<text x="42" y="170" font-size="18" >Draw baseline (i,j) from Q. Player sees z from K[i,z], NOT the hidden baseline action i.</text>
<text x="42" y="203" font-size="17" >Pass keeps i. Override chooses d. Opponent stays at j. Payoff changes are scored cell by cell.</text>
<text x="42" y="244" font-size="21" font-weight="700">Coarse gain  &lt;=  supplied-channel override gain  &lt;=  full-swap gain</text>
<text x="42" y="294" font-size="22" font-weight="700">1 A rare reveal changes the available override policy</text>
<text x="42" y="327" font-size="18" >Roth fixture: reveal C with probability alpha, otherwise emit one common signal.</text>
<text x="42" y="359" font-size="17" class="muted">Uniform diagonal baseline; both players have the same values. No learned channel.</text>
<text x="65" y="410" font-size="18" font-weight="700">Reveal probability</text>
<text x="65" y="459" font-size="18" font-weight="700">Override gain</text>
<text x="400" y="410" font-size="20" id="cell-reveal-0" data-value="0">0</text>
<text x="400" y="459" font-size="20" id="cell-gain-0" data-value="0">0</text>
<text x="555" y="410" font-size="20" id="cell-reveal-1" data-value="1/4">1/4</text>
<text x="555" y="459" font-size="20" id="cell-gain-1" data-value="11/120">11/120</text>
<text x="710" y="410" font-size="20" id="cell-reveal-2" data-value="1/2">1/2</text>
<text x="710" y="459" font-size="20" id="cell-gain-2" data-value="11/60">11/60</text>
<text x="865" y="410" font-size="20" id="cell-reveal-3" data-value="1">1</text>
<text x="865" y="459" font-size="20" id="cell-gain-3" data-value="11/30">11/30</text>
<text x="42" y="515" font-size="22" font-weight="700">2 The number of signals alone does not determine incentive value</text>
<text x="42" y="548" font-size="17" >Developed cyclic table [[0,-10,3],[1,0,-10],[-10,2,0]], uniform diagonal Q; column pays 0.</text>
<text x="65" y="595" font-size="18" font-weight="700">Partition labels</text>
<text x="65" y="644" font-size="18" font-weight="700">Row override gain</text>
<text x="355" y="595" font-size="20" id="cell-partition-0" data-value="000">000</text>
<text x="355" y="644" font-size="20" id="cell-partition-value-0" data-value="0">0</text>
<text x="490" y="595" font-size="20" id="cell-partition-1" data-value="001">001</text>
<text x="490" y="644" font-size="20" id="cell-partition-value-1" data-value="4/3">4/3</text>
<text x="625" y="595" font-size="20" id="cell-partition-2" data-value="010">010</text>
<text x="625" y="644" font-size="20" id="cell-partition-value-2" data-value="5/3">5/3</text>
<text x="760" y="595" font-size="20" id="cell-partition-3" data-value="011">011</text>
<text x="760" y="644" font-size="20" id="cell-partition-value-3" data-value="1">1</text>
<text x="895" y="595" font-size="20" id="cell-partition-4" data-value="012">012</text>
<text x="895" y="644" font-size="20" id="cell-partition-value-4" data-value="2">2</text>
<text x="42" y="689" font-size="17" >001, 010, 011 each use two signals, but pool different baseline actions. They are incomparable.</text>
<text x="42" y="742" font-size="22" font-weight="700">3 Supplied post-garbling: a lifted policy proves monotonicity</text>
<text x="42" y="775" font-size="17" >Roth identity signals -&gt; independent fair-bit signals. The lifted policy passes everywhere.</text>
<text x="65" y="824" font-size="17" font-weight="700">Original gain</text>
<text x="110" y="865" font-size="20" id="cell-high" data-value="11/30">11/30</text>
<text x="320" y="824" font-size="17" font-weight="700">Garbled gain</text>
<text x="365" y="865" font-size="20" id="cell-low" data-value="0">0</text>
<text x="575" y="824" font-size="17" font-weight="700">Lifted gain</text>
<text x="620" y="865" font-size="20" id="cell-lift" data-value="0">0</text>
<text x="830" y="824" font-size="17" font-weight="700">Information loss</text>
<text x="875" y="865" font-size="20" id="cell-loss" data-value="11/30">11/30</text>
<text x="65" y="916" font-size="17" >Original-signal slacks:</text>
<text x="400" y="916" font-size="20" id="cell-slack-0" data-value="0">0</text>
<text x="555" y="916" font-size="20" id="cell-slack-1" data-value="0">0</text>
<text x="710" y="916" font-size="20" id="cell-slack-2" data-value="11/30">11/30</text>
<text x="65" y="954" font-size="18" >Information loss = sum of nonnegative original-signal optimality slacks.</text>
<text x="42" y="1007" font-size="17" >Every signal/candidate retains full joint-cell terms, conditional gains, ties and an attaining policy.</text>
<text x="42" y="1042" font-size="17" >All 1, 2, 5, 15 deterministic partitions for 1..4 actions; every strict refinement is checked.</text>
<text x="42" y="1083" font-size="16" class="muted">No transformed CE, simultaneous override, channel-order search, privacy, learning or safety claim.</text>
