<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1280" viewBox="0 0 1120 1280">
<rect width="1120" height="1280" fill="#edf2f5"/><rect x="16" y="16" width="1088" height="1248" rx="18" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#24313b}.muted{fill:#5c6c78}</style>
<text x="42" y="58" font-size="26" font-weight="700">Correlab / the recommendation changes the deviation</text>
<text x="42" y="88" font-size="17" class="muted">Exact supplied joint-play audits. Both players maximize. No sampling, training or equilibrium search.</text>
<text x="42" y="135" font-size="21" font-weight="700">1 Coarse obedience does not imply recommendation-wise obedience</text>
<text x="42" y="166" font-size="17" >Roth lecture-8 game: diagonal payoffs 1, 1, -11/10; joint law is uniform on that diagonal.</text>
<text x="42" y="197" font-size="17" >Both players have the same figures. On recommendation C, switching to A or B gains 11/10.</text>
<text x="55" y="239" font-size="17" >Expected obey payoff</text>
<text x="375" y="239" font-size="18" id="cell-coarse-payoff" data-value="3/10">3/10</text>
<text x="55" y="277" font-size="17" >Best fixed-action payoff</text>
<text x="375" y="277" font-size="18" id="cell-coarse-fixed" data-value="0">0</text>
<text x="55" y="315" font-size="17" >Best fixed gain (raw)</text>
<text x="375" y="315" font-size="18" id="cell-coarse-raw" data-value="-3/10">-3/10</text>
<text x="55" y="353" font-size="17" >Clipped CCE epsilon</text>
<text x="375" y="353" font-size="18" id="cell-coarse-epsilon" data-value="0">0</text>
<text x="570" y="239" font-size="17" >Pairwise weighted epsilon</text>
<text x="930" y="239" font-size="18" id="cell-coarse-pair" data-value="11/30">11/30</text>
<text x="570" y="277" font-size="17" >Full-swap epsilon</text>
<text x="930" y="277" font-size="18" id="cell-coarse-swap" data-value="11/30">11/30</text>
<text x="570" y="315" font-size="17" >Worst conditional epsilon</text>
<text x="930" y="315" font-size="18" id="cell-coarse-conditional" data-value="11/10">11/10</text>
<text x="570" y="353" font-size="16" >CCE: yes. CE: no. One attaining swap is [A,B,A].</text>
<text x="42" y="411" font-size="21" font-weight="700">2 The product of the marginals is a different, exploitable law</text>
<text x="42" y="443" font-size="17" >Coordination game: both payoff tables are [[2,0],[0,1]]. Joint play uses the two diagonal cells.</text>
<text x="70" y="480" font-size="17" font-weight="700">Supplied joint law</text>
<rect x="70" y="499" width="71" height="40" rx="4" fill="#dceae9"/>
<text x="87" y="526" font-size="18" id="cell-joint-0-0" data-value="1/2">1/2</text>
<rect x="150" y="499" width="71" height="40" rx="4" fill="#dceae9"/>
<text x="167" y="526" font-size="18" id="cell-joint-0-1" data-value="0">0</text>
<rect x="70" y="547" width="71" height="40" rx="4" fill="#dceae9"/>
<text x="87" y="574" font-size="18" id="cell-joint-1-0" data-value="0">0</text>
<rect x="150" y="547" width="71" height="40" rx="4" fill="#dceae9"/>
<text x="167" y="574" font-size="18" id="cell-joint-1-1" data-value="1/2">1/2</text>
<text x="360" y="480" font-size="17" font-weight="700">Product control</text>
<rect x="360" y="499" width="71" height="40" rx="4" fill="#dceae9"/>
<text x="377" y="526" font-size="18" id="cell-product-0-0" data-value="1/4">1/4</text>
<rect x="440" y="499" width="71" height="40" rx="4" fill="#dceae9"/>
<text x="457" y="526" font-size="18" id="cell-product-0-1" data-value="1/4">1/4</text>
<rect x="360" y="547" width="71" height="40" rx="4" fill="#dceae9"/>
<text x="377" y="574" font-size="18" id="cell-product-1-0" data-value="1/4">1/4</text>
<rect x="440" y="547" width="71" height="40" rx="4" fill="#dceae9"/>
<text x="457" y="574" font-size="18" id="cell-product-1-1" data-value="1/4">1/4</text>
<text x="640" y="517" font-size="16" >Expected payoff</text>
<text x="640" y="564" font-size="16" >Full-swap epsilon</text>
<text x="850" y="481" font-size="16" font-weight="700">Joint</text>
<text x="965" y="481" font-size="16" font-weight="700">Product</text>
<text x="850" y="517" font-size="18" id="cell-joint-payoff" data-value="3/2">3/2</text>
<text x="850" y="564" font-size="18" id="cell-joint-epsilon" data-value="0">0</text>
<text x="965" y="517" font-size="18" id="cell-product-payoff" data-value="3/4">3/4</text>
<text x="965" y="564" font-size="18" id="cell-product-epsilon" data-value="1/4">1/4</text>
<text x="42" y="630" font-size="21" font-weight="700">3 A rare recommendation can hide a large conditional gain</text>
<text x="42" y="662" font-size="17" >Row action 0 always pays 1; action 1 pays 0. Action 1 is recommended only once per thousand.</text>
<text x="60" y="705" font-size="17" font-weight="700">Recommendation mass</text>
<text x="120" y="745" font-size="18" id="cell-rare-mass" data-value="1/1000">1/1000</text>
<text x="400" y="705" font-size="17" font-weight="700">Weighted gain</text>
<text x="460" y="745" font-size="18" id="cell-rare-weighted" data-value="1/1000">1/1000</text>
<text x="770" y="705" font-size="17" font-weight="700">Conditional gain</text>
<text x="830" y="745" font-size="18" id="cell-rare-conditional" data-value="1">1</text>
<text x="42" y="800" font-size="21" font-weight="700">4 Full swap regret adds gains across recommendations</text>
<text x="42" y="832" font-size="17" >One-column game: row payoffs [0,0,1], three equally likely recommendations.</text>
<text x="60" y="875" font-size="17" >Largest one-pair gain</text>
<text x="335" y="875" font-size="18" id="cell-aggregate-pair" data-value="1/3">1/3</text>
<text x="570" y="875" font-size="17" >Full-swap gain</text>
<text x="820" y="875" font-size="18" id="cell-aggregate-swap" data-value="2/3">2/3</text>
<text x="60" y="921" font-size="17" >Attaining action map:</text>
<text x="335" y="921" font-size="18" id="cell-map-0" data-value="2">2</text>
<text x="400" y="921" font-size="18" id="cell-map-1" data-value="2">2</text>
<text x="465" y="921" font-size="18" id="cell-map-2" data-value="2">2</text>
<text x="570" y="921" font-size="16" >Pairwise epsilon and swap epsilon differ.</text>
<text x="42" y="976" font-size="21" font-weight="700">5 A finite-history identity is not a last-round or learning guarantee</text>
<text x="42" y="1008" font-size="17" >Developed realized play in the first game: CC, AA, BB, AA, BB, CC.</text>
<text x="60" y="1052" font-size="16" font-weight="700">Prefix rounds</text>
<text x="60" y="1095" font-size="16" font-weight="700">Empirical CCE epsilon</text>
<text x="380" y="1052" font-size="18" id="cell-prefix-0-rounds" data-value="1">1</text>
<text x="380" y="1095" font-size="18" id="cell-prefix-0-epsilon" data-value="11/10">11/10</text>
<text x="525" y="1052" font-size="18" id="cell-prefix-1-rounds" data-value="2">2</text>
<text x="525" y="1095" font-size="18" id="cell-prefix-1-epsilon" data-value="11/20">11/20</text>
<text x="670" y="1052" font-size="18" id="cell-prefix-2-rounds" data-value="3">3</text>
<text x="670" y="1095" font-size="18" id="cell-prefix-2-epsilon" data-value="0">0</text>
<text x="815" y="1052" font-size="18" id="cell-prefix-3-rounds" data-value="6">6</text>
<text x="815" y="1095" font-size="18" id="cell-prefix-3-epsilon" data-value="0">0</text>
<text x="60" y="1141" font-size="17" >Final empirical law is CCE, but last-round CCE epsilon is</text>
<text x="820" y="1141" font-size="18" id="cell-last-epsilon" data-value="11/10">11/10</text>
<text x="42" y="1192" font-size="16" >All deviation terms, conditional gains, swap choices and realized regret totals remain in the JSON.</text>
<text x="42" y="1226" font-size="15" class="muted">Small supplied games only. No causal, convergence, statistical, safety or real-agent performance claim.</text>
<metadata id="report-zlib-base64"></metadata></svg>
